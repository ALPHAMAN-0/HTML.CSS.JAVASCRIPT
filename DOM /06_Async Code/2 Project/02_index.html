<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Code</title>
</head>
<body>  
    <h1>Async Code</h1>
    <button onclick="console.log('This is a sync code')">Start </button>
    <button id="stop">Stop</button>
</body>
<script>
    const name = function(){
        console.log('SIAM')
    }
    const intervalId = setInterval(name, 1000);

    clearInterval(intervalId);
    
</script>
</html>
