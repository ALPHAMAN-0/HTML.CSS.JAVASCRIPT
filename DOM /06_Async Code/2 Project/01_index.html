<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Async Code</title>
</head>
<body>  
    <h1>Async Code</h1>
    <button onclick="console.log('This is a sync code')">Click Me</button>
    <button id="stop">Stop Timeout</button>
</body>
<script>
       const name = function(){
         console.log("siam")
       }
        const changeMesetTimeout = setTimeout(name, 2000);

        document.querySelector('#stop').addEventListener('click', function(){
            clearTimeout(changeMesetTimeout);
            console.log("Timeout stopped");
        })
</script>
</html>
