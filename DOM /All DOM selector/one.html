<!--

textContent, innerText, innerHTML — same value, but different use cases!

// Example for kids:

<div id="myDiv">
    Hello <span style="display:none">World</span>!
</div>

// 1. textContent
// Shows ALL the text, even hidden ones:
// myDiv.textContent → "Hello World!"

// 2. innerText
// Shows only what you SEE on the page:
// myDiv.innerText → "Hello !"

// 3. innerHTML
// Shows the HTML inside:
// myDiv.innerHTML → "Hello <span style=\"display:none\">World</span>!"

// In short:
// textContent = all text (even hidden)
// innerText = only visible text
// innerHTML = HTML code inside

querySelector(' selector ') - selects the first matching element

getElementByClassName

-->
