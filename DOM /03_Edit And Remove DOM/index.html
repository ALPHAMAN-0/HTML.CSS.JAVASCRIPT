<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit and Remove DOM Elements</title>
</head>
<body>
    <h1>Edit and Remove DOM Elements</h1>
    <ul class="language">
        <li>JavaScript</li>
        <li>Python</li>
        <li>Java</li>
        <li>C++</li>
        <li>Ruby</li>
    </ul>

</body>
<script>
        //not good practice
        function addLanguage(languageName){
            const li = document.createElement('li');
            li.innerHTML = languageName;
            document.querySelector('.language').appendChild(li);
         }
         addLanguage('Go');
         addLanguage('Rust');

         //optimal approach
         function addOptimalApproach(languageName){
            const li = document.createElement('li');
            li.appendChild(document.createTextNode(languageName));
            document.querySelector('.language').appendChild(li);
         }
            addOptimalApproach('TypeScript');
            addOptimalApproach('Kotlin');
         
        //editing existing elements
        const secoundLang = document.querySelector("li:nth-child(2)");
        
        const newli = document.createElement('li');
        newli.textContent = "C#";
        
        // secoundLang.innerHTML = "C#"; //not good practice
        // secoundLang.textContent = "C#"; //optimal approach
        // secoundLang.replaceWith(newli);
        
        const firstLang = document.querySelector("li:first-child");
        firstLang.outerHTML = "<li>HTML</li>"; //not good practice

        //removing elements
        const lastLang = document.querySelector("li:last-child");
        // lastLang.remove(); //optimal approach
</script>
</html>
