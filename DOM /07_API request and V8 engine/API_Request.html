<!DOCTYPE html>
<html lang="en">    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>API Request</title>
</head>
<body>
    <h1>API Request</h1>
<script>
    const requestURL = 'https://api.github.com/users/ALPHAMAN-0'
    const object = new XMLHttpRequest();

    object.open('GET', requestURL);

    object.onreadystatechange = function(){
        console.log(object.readyState);
        if(object.readyState === 4){
            const data = JSON.parse(this.responseText);
            console.log(data);
        }
    }
    object.send();
  //github we can see v8 engine for learning some concepts of js https://github.com/v8/v8
</script>
</body>
</html>
