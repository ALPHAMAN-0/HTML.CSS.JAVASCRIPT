<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blind Call</title>
</head>
<body>
    <h1>Blind Call Example</h1>
    <button id="callButton">Make Blind Call</button>
</body>
<script>
     class React{
        constructor(){
            this.libary = "React Library";
            this.server = "https://localhost:3000";

            //requirement
            document
                .querySelector("#callButton")
                .addEventListener("click", this.hanleClick.bind(this));
        }
        hanleClick(){
            console.log("Button Clicked");
            console.log("Making Blind Call to " + this.server);
        }
     }
     // Create an instance so the constructor runs
     new React();
</script>
</html>
